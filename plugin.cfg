[plugin]

name="ez-tree-godot-port"
description="Procedural tree generator based on EZ-Tree (dgreenheck/ez-tree). Adds an EZTree node that generates a tree mesh from adjustable parameters, and an EZTreeDraw node for painting forests onto ground geometry in the editor."
author="Dan Greenheck (original library), Godot port"
version="0.2.0"
script="plugin.gd"
